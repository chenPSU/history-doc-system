# Thai spellings of names, shared by every Thai episode (TASKS P1.6), so one person or place is spelled the same
# way across the channel. Follows common Thai usage (Thai Wikipedia / Royal Institute style) where one exists.
# tools/adapt_th.py fills the CAST:/PLACES: lines of a new Thai script from the names its English script uses.
# `en` is matched as a whole word in the English script; `th` is what the Thai script writes.
