# Map clips for the shots of episodes/2026-12-14-en-constantinople (TASKS P4.4).
# Extends constantinople.yaml (walls, chain, Galata, labels). One clip per map shot; `shot:` binds it:
#   python tools/map.py data/maps/constantinople_episode.yaml --bind episodes/2026-12-14-en-constantinople
# Layers already on screen when a shot starts use appear: -1. Clips with `approximate: true` draw hand-made
# borders (simplified from general historical atlases, not traced from one source); areas are clipped to the coast.
# Coasts: OSM (city, Bosphorus; ODbL credit on frame), Natural Earth (regions; public domain).
