# Map library for the Constantinople 1453 episode (TASKS P3.3). Used by tools/map.py.
# Coordinates are lon, lat. Historical lines are traced by hand from the gate positions below and are
# approximate (about 100 m). Coast: OpenStreetMap (modern shoreline; the Marmara shore has some landfill).
land: constantinople          # data/geo/constantinople.geojson

features:
  # Theodosian land walls, Golden Horn (Blachernae, Ayvansaray) to the Sea of Marmara (Golden Gate, Yedikule).
  land_walls:
    type: line
    style: wall
    side: byz
    coords:
      - [28.9440, 41.0408]   # Ayvansaray, Golden Horn end
      - [28.9405, 41.0392]   # Blachernae, Anemas prisons
      - [28.9395, 41.0345]   # Palace of the Porphyrogenitus (Tekfur Sarayi)
      - [28.9345, 41.0300]   # Gate of Charisius (Edirnekapi)
      - [28.9285, 41.0240]   # Pempton gate (Sulukulekapi)
      - [28.9215, 41.0180]   # Gate of St Romanus (Topkapi)
      - [28.9200, 41.0095]   # Rhegium gate (Mevlanakapi)
      - [28.9185, 41.0035]   # Gate of the Spring (Silivrikapi)
      - [28.9195, 40.9985]   # Belgradkapi
      - [28.9225, 40.9935]   # Golden Gate (Yedikule)
      - [28.9245, 40.9905]   # Sea of Marmara end
  # The boom across the Golden Horn: Gate of Eugenius (Sirkeci side) to the Galata shore.
  chain:
    type: line
    style: chain
    side: byz
    coords:
      - [28.9785, 41.0158]
      - [28.9760, 41.0192]
      - [28.9745, 41.0222]
  # Genoese Galata (Pera), walled, officially neutral.
  galata:
    type: area
    side: neutral
    label: Galata (Genoese)
    coords:
      - [28.9700, 41.0240]
      - [28.9722, 41.0278]
      - [28.9752, 41.0290]
      - [28.9805, 41.0285]
      - [28.9842, 41.0262]
      - [28.9800, 41.0244]
      - [28.9748, 41.0238]
  # Route of the ships hauled overland on 22 April: from the Bosphorus (Double Columns) over the hill
  # behind Galata, down the Valley of the Springs (Kasimpasa) into the Golden Horn.
  galata_road:
    type: line
    style: route
    side: ott
    arrow: true
    coords:
      - [29.0045, 41.0408]
      - [29.0010, 41.0398]
      - [28.9930, 41.0405]
      - [28.9850, 41.0388]
      - [28.9770, 41.0370]
      - [28.9700, 41.0350]
      - [28.9640, 41.0322]
  ottoman_camp:
    type: marker
    side: ott
    at: [28.9095, 41.0195]
    label: Mehmed's tent
  lbl_city: {type: label, kind: city, text: Constantinople, at: [28.9560, 41.0120]}
  lbl_horn: {type: label, kind: water, text: Golden Horn, at: [28.9505, 41.0352], angle: -52}
  lbl_bosphorus: {type: label, kind: water, text: Bosphorus, at: [29.0080, 41.0330], angle: -48}
  lbl_marmara: {type: label, kind: water, text: Sea of Marmara, at: [28.9500, 40.9905]}
  lbl_romanus: {type: label, kind: place, text: Gate of St Romanus, at: [28.9045, 41.0150]}
  lbl_hagia: {type: marker, side: byz, at: [28.9802, 41.0086], label: Hagia Sophia}

clips:
  # P3.3 acceptance clip: walls, Golden Horn, chain, Galata road in 10 seconds.
  overview_10s:
    duration: 10
    view: [28.878, 40.975, 29.038, 41.055]
    camera:
      - {t: 0, center: [28.957, 41.013], zoom: 1.0}
      - {t: 10, center: [28.960, 41.016], zoom: 1.05}
    title: {text: The siege of 1453, sub: 6 April – 29 May, appear: 0.3, position: br}
    show:
      - {use: lbl_city, appear: 0.6}
      - {use: lbl_marmara, appear: 0.9}
      - {use: lbl_bosphorus, appear: 1.1}
      - {use: land_walls, draw: [1.4, 4.0]}
      - {use: lbl_horn, appear: 4.0}
      - {use: chain, draw: [4.6, 5.6]}
      - {use: galata, appear: 5.8}
      - {use: galata_road, draw: [6.8, 9.2]}
