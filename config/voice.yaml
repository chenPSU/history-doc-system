# Narration voice settings (TASKS P2.1, decisions D5).
# EN provider is decided by the owner's listening test (Gemini vs ElevenLabs). TH uses Gemini.
# API keys live in .env (GEMINI_API_KEY, ELEVENLABS_API_KEY), never here.

sample_rate: 24000            # Hz, 16-bit mono PCM
max_chars_per_request: 700    # one request = one continuous paragraph group (~45 s of speech). Was 1400; smaller groups lose less when Gemini refuses one (SAFETY, 20 Nov 2026).
                              # Never one request per line: per-line takes sound disjointed (Lupas, 28 Oct 2026).
max_requests_default: 30      # hard cap per run; raise with --max-requests N after checking --plan
pause_between_blocks: 0.35    # seconds of silence between request blocks with no [PAUSE] cue
pause_between_sections: 0.8   # seconds of silence at a section change (## HOOK -> ## PROMISE ...)

languages:
  en:
    provider: gemini          # gemini | elevenlabs  (owner picks after the listening test)
    gemini:
      model: gemini-3.1-flash-tts-preview
      voice: Charon           # owner's pick after the listening test, 20 Nov 2026 (decisions D5)
      safety: BLOCK_ONLY_HIGH # default filters blocked a plain history paragraph (finishReason SAFETY, 20 Nov 2026)
      # History of the direction (20 Nov 2026, owner listening):
      #   v1 "calm, steady, no excitement": flat and slow (131 wpm).
      #   v2 storyteller: "like telling a secret", a little emotion. Kept as the main tone: intimate.
      #   v3 epic war documentary: "like a big scene, a beach landing", too heavy for 20 minutes. Kept as: epic.
      # The script picks the tone: [TONE: epic] ... [TONE: intimate]. Each section starts on its section_tones
      # entry (or default_tone). Aim for epic on roughly a quarter of the runtime: the hook and the big set pieces.
      default_tone: intimate
      section_tones:
        HOOK: epic
      tones:
        intimate: >-
          You are a gripping history storyteller with a deep, warm male voice, telling a true story
          to one listener who is hooked. Keep a brisk, natural pace, around 150 words a minute.
          Let the drama move you: speed up when events rush forward, slow down and lower your voice
          for the line that matters, and let questions hang for a beat. Sound human and involved,
          never theatrical, never monotone.
        epic: >-
          You are the narrator of an epic war documentary. Speak with a powerful, resonant, full chest voice
          that commands attention, like a trailer narrator telling a true story. Project your voice.
          Keep a strong, driving pace, around 150 words a minute. Hit names, numbers and turning words
          with real weight. Build intensity through each passage and land the key line hard.
          Confident and gripping at every moment; never soft, never sleepy, never monotone.
      section_styles:             # what each section is for; added after the tone text
        HOOK: Build suspense toward the question at the end.
        PROMISE: Lean in, as if sharing a secret.
        CONTEXT: Paint the scene. Move briskly through background facts.
        CHAPTER: Keep momentum. Slow down for surprises and small human details.
        TURNING POINT: This is the climax of the story. Let the stakes show.
        CLOSE: Reflective and slower, with quiet weight on the final lines.
    elevenlabs:
      model: eleven_multilingual_v2
      voice_id: ""            # filled after the owner picks a stock voice in the ElevenLabs library
  th:
    provider: gemini
    gemini:
      model: gemini-3.1-flash-tts-preview
      safety: BLOCK_ONLY_HIGH
      voice: Iapetus          # NOT Charon: Charon is the QURIO voice (D5: the channels must not sound alike)
      style: >-
        อ่านด้วยน้ำเสียงผู้ชาย สุขุม ลึก ช้ากว่าข่าว เล่าแบบสารคดีประวัติศาสตร์
        ลงน้ำหนักเบาๆ ที่ปี ชื่อ และตัวเลข ไม่ตื่นเต้น ไม่เร่ง แต่ไม่เรียบแบน
