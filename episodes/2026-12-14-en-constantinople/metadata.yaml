title: 'The Fall of Constantinople: The Last 53 Days of Byzantium'
description: 'For a thousand years, no army broke through the land walls of Constantinople. In the spring of 1453, a sultan
  who was not yet twenty-two did it in 53 days, with a cannon nobody else would pay for and a fleet dragged over a hill.


  This is the story of the last siege of Byzantium, from Mehmed''s fortress on the Bosphorus to the final assault on 29 May
  1453.'
