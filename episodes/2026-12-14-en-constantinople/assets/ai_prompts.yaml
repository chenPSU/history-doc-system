# AI illustration prompts (tools/images.py). Edit `subject` per shot; `style` from config/images.yaml.
# Only scenes no real image shows. People stay anonymous (no faces, no rulers); facts as in factsheet.md.
style: engraving
context: >-
  The siege of Constantinople, spring 1453. 15th-century Mediterranean ships, Ottoman and Italian
  sailors and soldiers in period dress, stone city walls with square towers.
real_people: [Mehmed, Constantine, Palaiologos, Giustiniani, Orban, Halil, Zaganos, Notaras, Grant,
              Sphrantzes, Barbaro, Doukas, Kritoboulos]
shots:
  82:
    sentence: One stone ball sank his ship.
    subject: >-
      A Venetian merchant galley breaking apart and sinking in a narrow strait, struck by a huge stone
      cannonball fired from a stone fortress on the steep shore, a plume of water, smoke drifting from the fortress
  172:
    sentence: They packed the gaps with timber, earth and barrels.
    subject: >-
      Night: small anonymous figures by torchlight filling a breach in a broken stone wall with timber beams,
      baskets of earth and wooden barrels, seen from a distance
  173:
    sentence: By morning, a new wall of earth and wood stood where stone had stood the day before.
    subject: >-
      Dawn: a rough stockade of earth, timber and barrels standing in the gap of a shattered stone wall,
      rubble below, morning mist, no people
  203:
    sentence: The tall Christian ships ride high above the Ottoman galleys.
    subject: >-
      Sea battle: four tall high-sided sailing ships with round sails, surrounded by a swarm of many low
      oared galleys far below their decks, city walls on the horizon
  218:
    sentence: His men laid a road of greased logs up the slope.
    subject: >-
      A long track of wooden logs laid across a steep wooded hillside like the rungs of a ladder,
      small workers greasing them with buckets of fat, seen from high above
  220:
    sentence: Oxen pulled.
    subject: >-
      Teams of yoked oxen straining on long ropes, hauling a wooden galley on log rollers up a hill,
      side view, drovers small and seen from behind
  221:
    sentence: Men pushed.
    subject: >-
      Seen from behind and below: a crowd of anonymous labourers leaning their shoulders into the stern
      of a galley on log rollers on a slope
  222:
    sentence: Some crews even raised their sails as they rolled over the top.
    subject: >-
      A galley with its sails raised and oars out, cresting a bare hilltop on rollers against the sky,
      a harbour visible far below on the other side, wide view
  233:
    sentence: But the Ottomans were ready.
    subject: >-
      Night harbour: a row of cannons on a dark shore firing flashes across the water at small ships
      loaded with fire, smoke and reflections on the water, wide view from the shore
  253:
    sentence: You crawl in the dark, in a tunnel barely wider than your shoulders.
    subject: >-
      A very narrow underground tunnel shored with timber props, lit by one small oil lamp,
      the dark shape of a crawling miner from behind
  255:
    sentence: You hold your breath.
    subject: >-
      Inside a timbered tunnel: a miner in silhouette pressing his ear to the earth wall,
      a lamp on the floor, deep shadows
  257:
    sentence: Your enemy is right in front of you.
    subject: >-
      A tunnel wall of earth caving in, a hole opening onto a second tunnel with lamplight and the dark
      silhouettes of diggers with picks on the other side
  303:
    sentence: At night, the camp blazed with fires.
    subject: >-
      A vast army camp of tents across a plain at night, hundreds of campfires, smoke and glow rising,
      the dark line of city walls and towers in the distance
