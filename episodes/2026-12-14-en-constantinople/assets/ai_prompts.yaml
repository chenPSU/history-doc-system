  1:
    sentence: It is just after midnight, on 29 May 1453.
    subject: 'Midnight: the great land walls under a thin crescent moon, a long line of square towers fading into
      the dark, a few small torches on the battlements, the dry moat in deep shadow below, seen from the empty field
      outside A dark night scene printed with heavy dark ink: the sky and the shadows are almost black; only moonlight
      and torchlight are pale.'
    context: 'The land walls of Constantinople in 1453. They stand on dry land, far inland from any sea: no water,
      no ships, no boats anywhere in the picture. Soldiers in 15th-century helmets and cloaks.'
